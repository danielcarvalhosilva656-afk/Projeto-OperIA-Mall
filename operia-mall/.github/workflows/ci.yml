name: CI
on: [push, pull_request]
jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r ai-service/requirements.txt && cd ai-service && pytest -q
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd api && npm install && npm run build && npm test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd web && npm install && npm run build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd mobile && npm install && npm run typecheck
  e2e:
    runs-on: ubuntu-latest
    needs: [ai, api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cp .env.example .env && docker compose up -d --build
      - run: for i in $(seq 1 40); do curl -sf localhost:3000/health && break || sleep 3; done
      - run: cd api && npm install && E2E_API=http://localhost:3000 npm run test:e2e
      - run: cd web && npm install && npx playwright install --with-deps chromium && npm run test:e2e
      - run: cd web && npx @lhci/cli autorun
      - if: failure()
        run: docker compose logs --tail=200
