services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: operia
      POSTGRES_PASSWORD: operia
      POSTGRES_DB: operia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  ai:
    build:
      context: ./ai-service
      args:
        WITH_ASR: "false"
    ports:
      - "8000:8000"

  api:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://operia:operia@db:5432/operia
      - JWT_SECRET=operia-super-secret-jwt-key-2026
    depends_on:
      - db
      - ai

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - api

volumes:
  pgdata: